# Eight checks: five run your program, two read it as Python, and one reads its text.
# The five program checks read only the book log at the end of a run, or the files the run
# wrote, and they forgive extra spaces, letter case, and a missing colon. They run your program
# on a short book written for the test as well as on alice.txt, whatever BOOK says. A loop that
# never ends fails its check after five seconds.

- description: "[COUNT] Words and Different words: every word from words_in(line) adds 1 to words and 1 to its count in counts"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_rabbit_hole.py::test_words_are_counted

- description: "[COUNT] Times is the looked-up word's count, or 0 when it is not a key of counts"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_rabbit_hole.py::test_looks_up_a_word

- description: "[COUNT] Most common and Count come from counts: a word seen for the first time gets a count of 1"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_rabbit_hole.py::test_most_common_word_with_enough_letters

- description: "[WRITE] The report file holds the same lines as the book log, and mode w starts it over on every run"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_rabbit_hole.py::test_the_report_file_is_written_over

- description: "[WRITE] Each run adds one line to the searches file, the word and its count, and mode a keeps the earlier lines"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_rabbit_hole.py::test_the_searches_file_is_added_to

- description: "[CODE] The book is read with open and encoding utf-8, and each count is stored under its word"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_structure.py::test_words_are_counted_in_a_dictionary

- description: "[CODE] The report is opened with mode w and the searches file with mode a"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_structure.py::test_files_are_written_with_w_and_a

- src/main.py:
  - description: "[CODE] No TODO markers remain: delete each TODO comment once its code is written, including Author"
    check: MatchFileFragment
    options:
      fragment: TODO
      count: 0
      exact: true
